{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block guest_content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-emoji big">🎓</span>
      <h1>Join CampusOne</h1>
      <p class="muted">Create your student account.</p>
    </div>
    <form method="post" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="name">Full name</label>
      <input id="name" type="text" name="name" required maxlength="120" autocomplete="name" value="{{ request.form.get('name', '') }}">
      <label for="college_id">College ID</label>
      <input id="college_id" type="text" name="college_id" required maxlength="80" autocomplete="off" value="{{ request.form.get('college_id', '') }}">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required maxlength="254" autocomplete="email" placeholder="you@campus.edu" value="{{ request.form.get('email', '') }}">
      <label for="phone">Phone <span class="muted">(optional)</span></label>
      <input id="phone" type="tel" name="phone" maxlength="30" autocomplete="tel" value="{{ request.form.get('phone', '') }}">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
      <button type="submit" class="btn btn-primary btn-block">Create student account</button>
    </form>
    <p class="muted" style="text-align:center;margin:16px 0 0;">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
