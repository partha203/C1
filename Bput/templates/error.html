{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="empty-state">
  <div class="empty-icon">⚠️</div>
  <h2>{{ code }}</h2>
  <p>{{ message }}</p>
  <a href="{{ url_for('common.index') }}" class="btn btn-primary">Go home</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="login-wrap">
  <div class="login-card">
    <h2>{{ code }}</h2>
    <p>{{ message }}</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-block">Go to login</a>
  </div>
</div>
{% endblock %}
